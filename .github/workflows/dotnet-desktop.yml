name: .NET Core Desktop

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    strategy:
      matrix:
        configuration: [Release]

    runs-on: windows-latest  

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    # Install the .NET Core workload
    - name: Install .NET Core
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 7.0.x

    # Add MSBuild to the PATH
    - name: Setup MSBuild.exe
      uses: microsoft/setup-msbuild@v2

    # Build the DamnScript and DamnScriptTests projects
    - name: Build DamnScript and DamnScriptTests
      run: |
        dotnet build DamnScript/DamnScript.csproj --configuration ${{ matrix.configuration }}
        dotnet build DamnScriptTests/DamnScriptTests.csproj --configuration ${{ matrix.configuration }}

    # Execute unit tests in DamnScriptTests project
    - name: Execute unit tests
      run: dotnet test DamnScriptTests/DamnScriptTests.csproj --configuration ${{ matrix.configuration }}
