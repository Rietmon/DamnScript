name: .NET Core Desktop

on:
  push:
    branches: 
      - "main"
  pull_request:
    branches: 
      - "main"

jobs:
  build:
    strategy:
      matrix:
        configuration: [Debug, Release]

    runs-on: windows-latest  

    steps:
      # Checkout the repository
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Set up .NET SDK
      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '7.0.x'

      # Setup MSBuild for building desktop applications
      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v2

      # Restore dependencies
      - name: Restore dependencies
        run: dotnet restore

      # Build the project with the specified configuration (Debug/Release)
      - name: Build project
        run: dotnet build --configuration ${{ matrix.configuration }}

      # Install NUnit Console if needed (optional)
      - name: Install NUnit Console
        run: dotnet tool install --global NUnit.ConsoleRunner --version 3.11.1

      # Run unit tests using NUnit
      - name: Run NUnit tests
        run: |
          nunit3-console ./_Binaries/${{ matrix.configuration }}/net7.0/net7.0/DamnScriptTests.dll
